name: pseudo_driver_ai
description: Mobile-first driver drowsiness detection and personalized alert prototype.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
